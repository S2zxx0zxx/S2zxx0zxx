<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" role="img" aria-labelledby="title desc">
<title id="title">Shipping timeline: game engine and chess building, storage and creator tools testing, finance and AI products shipped</title>
<desc id="desc">Curated static phase snapshot. The scheduled generator updates activity dates from public commit signals. Stages are not independently verified certifications.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5468FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
<style>
:root{--bg:#FBFBF8;--panel:#FFFFFF;--ink:#171717;--muted:#777771;--hair:#E5E5DF;--accent:#5468FF}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#11161D;--ink:#F3F4F6;--muted:#8B949E;--hair:#30363D;--accent:#7C8CFF}}
text{font-family:Consolas,monospace}.sans{font-family:Inter,Segoe UI,sans-serif}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.pulse{animation:beat 2.5s ease-in-out infinite}.flow{stroke-dasharray:7 10;animation:move 2s linear infinite}
@keyframes beat{0%,100%{opacity:.2}50%{opacity:.65}}@keyframes move{to{stroke-dashoffset:-34}}
@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none!important}}
</style>
<rect width="900" height="542" rx="24" fill="var(--bg)"/>
<text x="30" y="42" fill="#8B5CF6" letter-spacing="2" font-size="12">SHIPPING TIMELINE</text>
<text x="30" y="75" class="sans ink" font-size="27" font-weight="800">Research → Build → Audit → Production → Shipped</text>
<line x1="90" y1="112" x2="790" y2="112" stroke="var(--hair)" stroke-width="5" stroke-linecap="round"/>
<line class="flow" x1="90" y1="112" x2="790" y2="112" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
<circle cx="90" cy="112" r="9" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="90" y="88" text-anchor="middle" font-size="10" fill="var(--accent)" letter-spacing="1">RESEARCH</text><circle cx="265" cy="112" r="9" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="265" y="88" text-anchor="middle" font-size="10" fill="var(--accent)" letter-spacing="1">BUILD</text><circle cx="440" cy="112" r="9" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="440" y="88" text-anchor="middle" font-size="10" fill="var(--accent)" letter-spacing="1">AUDIT</text><circle cx="615" cy="112" r="9" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="615" y="88" text-anchor="middle" font-size="10" fill="var(--accent)" letter-spacing="1">PRODUCTION</text><circle cx="790" cy="112" r="9" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="790" y="88" text-anchor="middle" font-size="10" fill="var(--accent)" letter-spacing="1">SHIPPED</text><g transform="translate(790 150)"><circle class="" r="9" fill="#27B66D" opacity=".17"/><circle r="5" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">ToolsLab</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Shipped</text></g><g transform="translate(790 204)"><circle class="" r="9" fill="#27B66D" opacity=".17"/><circle r="5" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">FinCo</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Shipped</text></g><g transform="translate(790 258)"><circle class="" r="9" fill="#27B66D" opacity=".17"/><circle r="5" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">FitTrackAI</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Shipped</text></g><g transform="translate(790 312)"><circle class="" r="9" fill="#27B66D" opacity=".17"/><circle r="5" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">DigiRise</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Shipped</text></g><g transform="translate(790 366)"><circle class="" r="9" fill="#27B66D" opacity=".17"/><circle r="5" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">FinCalc</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Shipped</text></g><g transform="translate(790 420)"><circle class="" r="9" fill="#27B66D" opacity=".17"/><circle r="5" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">Zenvy</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Shipped</text></g><g transform="translate(265 150)"><circle class="pulse" r="9" fill="#5468FF" opacity=".17"/><circle r="5" fill="#5468FF"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">ARKYVON</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Building</text></g><g transform="translate(265 204)"><circle class="pulse" r="9" fill="#5468FF" opacity=".17"/><circle r="5" fill="#5468FF"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">Chess</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Building</text></g><g transform="translate(440 150)"><circle class="pulse" r="9" fill="#5468FF" opacity=".17"/><circle r="5" fill="#5468FF"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">OpenXdrive</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Testing</text></g><g transform="translate(440 204)"><circle class="pulse" r="9" fill="#5468FF" opacity=".17"/><circle r="5" fill="#5468FF"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" class="sans ink">LiveClip</text><text y="37" text-anchor="middle" font-size="9.5" class="muted">Testing</text></g>
<text x="30" y="518" font-size="10" class="muted">Curated phases · live commit timestamps return on the next successful profile generator run.</text>
