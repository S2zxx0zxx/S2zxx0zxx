eight="700" class="sans ink">FinCo</text><text y="37" text-anchor="middle" font-size="8.5" class="muted">18 Sep 2026</text></g><g transform="translate(790 150)"><circle class="" r="9" fill="#27B66D" opacity=".18"/><circle r="4.8" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="10" font-weight="700" class="sans ink">FitTrackAI</text><text y="37" text-anchor="middle" font-size="8.5" class="muted">private product</text></g><g transform="translate(790 204)"><circle class="" r="9" fill="#27B66D" opacity=".18"/><circle r="4.8" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="10" font-weight="700" class="sans ink">DigiRise</text><text y="37" text-anchor="middle" font-size="8.5" class="muted">29 Aug 2026</text></g><g transform="translate(790 258)"><circle class="" r="9" fill="#27B66D" opacity=".18"/><circle r="4.8" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="10" font-weight="700" class="sans ink">FinCalc</text><text y="37" text-anchor="middle" font-size="8.5" class="muted">21 Apr 2026</text></g><g transform="translate(790 312)"><circle class="" r="9" fill="#27B66D" opacity=".18"/><circle r="4.8" fill="#27B66D"/><text y="22" text-anchor="middle" font-size="10" font-weight="700" class="sans ink">Zenvy</text><text y="37" text-anchor="middle" font-size="8.5" class="muted">9 Apr 2026</text></g><text x="30" y="344" font-size="10" class="muted">Phase is curated product state · dates refresh from public repository commit signals.</text>
</svg>