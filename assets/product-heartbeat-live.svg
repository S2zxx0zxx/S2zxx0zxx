<style>
:root{--bg:#FBFBF8;--panel:#FFFFFF;--ink:#171717;--muted:#777771;--hair:#E5E5DF;--soft:#F3F3EF;--accent:#5468FF;--accent2:#8B5CF6;--good:#27B66D;--warn:#F59E0B}
