@media (prefers-reduced-motion:reduce){.pulse,.blink,.flow,.reveal,.scan,.orbit,.cityscan{animation:none!important}}
.orbit{transform-origin:450px 292px;animation:orbit 42s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}
</style>
