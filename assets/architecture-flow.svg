<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060d"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="url(#abg)"/>
  <text x="700" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#f1f5f9">MULTI-PRODUCT SYSTEM FLOW</text>
  <text x="700" y="72" font-family="Consolas, monospace" font-size="13" text-anchor="middle" fill="#94a3b8">how a request moves through the active build portfolio</text>

  <!-- User entry -->
  <rect x="600" y="100" width="200" height="60" rx="16" fill="url(#nodeA)"/>
  <text x="700" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">User / Client</text>

  <line x1="700" y1="160" x2="700" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="560" y="212" width="280" height="66" rx="16" fill="url(#nodeB)"/>
  <text x="700" y="240" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#fff">Interface Layer</text>
  <text x="700" y="260" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#e0f2fe">ToolsLab UI &#8226; BharatOS WhatsApp Bot &#8226; DigiRise site</text>

  <!-- three branches -->
  <line x1="700" y1="278" x2="330" y2="340" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="700" y1="278" x2="700" y2="340" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="700" y1="278" x2="1070" y2="340" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ToolsLab branch -->
  <rect x="140" y="342" width="380" height="120" rx="16" fill="none" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="330" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c4b5fd">ToolsLab / ToolsHub</text>
  <g font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">
    <text x="160" y="392">Cloudflare Worker &#8594; Firebase Auth/Firestore</text>
    <text x="160" y="412">OmniRoute proxy &#8594; L3 fallback: CF Workers AI</text>
    <text x="160" y="432">Vectorize RAG &#8226; Razorpay billing &#8226; PWA shell</text>
    <text x="160" y="452">Tiers: Free / Starter / Pro / Max</text>
  </g>

  <!-- BharatOS branch -->
  <rect x="560" y="342" width="280" height="120" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="700" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">BharatOS</text>
  <g font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">
    <text x="580" y="392">Master Router Agent &#8594; domain ID</text>
    <text x="580" y="412">Parallel agent swarm (Ruflo)</text>
    <text x="580" y="432">11 modules &#8226; 3-tier model cost routing</text>
    <text x="580" y="452">Claude API + Gemini fallback</text>
  </g>

  <!-- DigiRise branch -->
  <rect x="880" y="342" width="380" height="120" rx="16" fill="none" stroke="#fb923c" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="1070" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fdba74">DigiRise India (Agency)</text>
  <g font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">
    <text x="900" y="392">Client sites (LAL Sweets, Kirtilals, TradeScribe...)</text>
    <text x="900" y="412">Partner OS &#8226; Firebase Realtime DB &#8226; Admin panel</text>
    <text x="900" y="432">Lead scoring &#8226; WhatsApp-first CRO funnels</text>
    <text x="900" y="452">Real 6&#8211;8 client roster, verified 2026</text>
  </g>

  <!-- converge to delivery -->
  <line x1="330" y1="462" x2="700" y2="530" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="700" y1="462" x2="700" y2="530" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1070" y1="462" x2="700" y2="530" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="540" y="532" width="320" height="70" rx="16" fill="url(#nodeC)"/>
  <text x="700" y="562" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">Delivery &#38; Ops Layer</text>
  <text x="700" y="586" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fff7ed">Vercel &#183; GitHub Pages &#183; Cloudflare DNS &#183; monitored deploys</text>

  <text x="700" y="650" font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#64748b">
    every branch verified via live codebase audits &#8212; not aspirational architecture
  </text>
  <text x="700" y="672" font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#64748b">
    known live risk: OmniRoute tunnel depends on a single always-on personal machine
  </text>
</svg>
