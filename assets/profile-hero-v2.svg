<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Satyam Kumar — Satzzxzxx</title><desc id="desc">Builder, creator and digital entrepreneur shipping AI, finance, web and mobile products.</desc>
<defs>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#171717" stroke-opacity=".045"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5468ff"/><stop offset=".5" stop-color="#8f6dff"/><stop offset="1" stop-color="#27b66d"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="#fbfbf7"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<circle cx="1030" cy="68" r="90" fill="#8f6dff" opacity=".08" filter="url(#soft)"><animate attributeName="opacity" values=".05;.13;.05" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="170" cy="350" r="110" fill="#27b66d" opacity=".06" filter="url(#soft)"><animate attributeName="opacity" values=".04;.10;.04" dur="6s" repeatCount="indefinite"/></circle>
<rect x="54" y="44" width="1092" height="332" rx="25" fill="#fff" fill-opacity=".72" stroke="#d9d9d2"/>
<rect x="54" y="44" width="1092" height="4" rx="2" fill="url(#accent)"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></rect>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#171717">
  <text x="600" y="142" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="3" fill="#5f5f59">BUILDING IN PUBLIC</text>
  <text x="600" y="210" text-anchor="middle" font-size="50" font-weight="800" letter-spacing="-2">SATYAM KUMAR</text>
  <text x="600" y="248" text-anchor="middle" font-size="19" font-weight="600" fill="#6c6c66">aka Satzzxzxx · Builder · Creator · Digital Entrepreneur</text>
  <text x="600" y="300" text-anchor="middle" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" fill="#7d7d76">AI · finance · web · mobile · product systems</text>
</g>
<g transform="translate(456 327)">
  <rect width="288" height="36" rx="18" fill="#f4fbf6" stroke="#cfe8d8"/>
  <circle cx="22" cy="18" r="6" fill="#27b66d"><animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.55;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="40" y="23" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" fill="#2f8051">ACTIVELY SHIPPING</text>
</g>
<rect x="-160" y="367" width="160" height="2" fill="#5468ff" opacity=".7"><animate attributeName="x" from="-160" to="1200" dur="5.8s" repeatCount="indefinite"/></rect>
</svg>