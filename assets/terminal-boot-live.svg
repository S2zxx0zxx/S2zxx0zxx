<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">Live builder terminal</title>
<desc id="desc">Auto-generated live profile visualization for S2zxx0zxx.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5468FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
:root{--bg:#FBFBF8;--panel:#FFFFFF;--ink:#171717;--muted:#777771;--hair:#E5E5DF;--soft:#F3F3EF;--accent:#5468FF;--accent2:#8B5CF6;--good:#27B66D;--warn:#F59E0B}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#11161D;--ink:#F3F4F6;--muted:#8B949E;--hair:#30363D;--soft:#161B22;--accent:#7C8CFF;--accent2:#A78BFA;--good:#3DDC84;--warn:#F7B955}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{fill:var(--panel);stroke:var(--hair)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.hair{stroke:var(--hair)}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.blink{animation:blink 1s steps(1,end) infinite}.flow{stroke-dasharray:7 9;animation:flow 2.2s linear infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.18)}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.pulse,.blink,.flow,.reveal,.scan,.orbit,.cityscan{animation:none!important}}
.reveal{opacity:0;animation:reveal 8.4s ease-in-out infinite}.r0{animation-delay:.35s}.r1{animation-delay:.83s}.r2{animation-delay:1.31s}.r3{animation-delay:1.79s}.r4{animation-delay:2.27s}.scan{animation:scan 4.2s linear infinite}@keyframes reveal{0%,4%{opacity:0;transform:translateY(6px)}8%,86%{opacity:1;transform:none}96%,100%{opacity:0}}@keyframes scan{0%{transform:translateX(-760px);opacity:0}8%{opacity:.45}82%{opacity:.12}100%{transform:translateX(820px);opacity:0}}
</style>
<rect width="900" height="350" rx="24" fill="var(--bg)"/><rect x="20" y="20" width="860" height="310" rx="20" class="panel"/><circle cx="50" cy="52" r="5" fill="#FF5F57"/><circle cx="68" cy="52" r="5" fill="#FEBC2E"/><circle cx="86" cy="52" r="5" fill="#28C840"/><text x="112" y="57" font-size="12" class="muted">SATZZXZXX // LIVE BUILDER TERMINAL</text><text x="830" y="57" text-anchor="end" font-size="11" fill="#27B66D">● TELEMETRY ON</text><line x1="40" y1="74" x2="860" y2="74" class="hair"/><g class="reveal r0"><text x="52" y="106" font-size="12" class="muted">00</text><text x="94" y="106" font-size="12" fill="#27B66D">BOOT</text><text x="156" y="106" font-size="14" class="ink">profile kernel</text><text x="830" y="106" text-anchor="end" font-size="12" class="muted">ONLINE</text></g><g class="reveal r1"><text x="52" y="148" font-size="12" class="muted">01</text><text x="94" y="148" font-size="12" fill="#5468FF">MAP</text><text x="156" y="148" font-size="14" class="ink">repo universe</text><text x="830" y="148" text-anchor="end" font-size="12" class="muted">39 PUBLIC / 49 MAPPED</text></g><g class="reveal r2"><text x="52" y="190" font-size="12" class="muted">02</text><text x="94" y="190" font-size="12" fill="#F59E0B">SHIP</text><text x="156" y="190" font-size="14" class="ink">FinCo-Pilot</text><text x="830" y="190" text-anchor="end" font-size="12" class="muted">HARDENING</text></g><g class="reveal r3"><text x="52" y="232" font-size="12" class="muted">03</text><text x="94" y="232" font-size="12" fill="#27B66D">BUILD</text><text x="156" y="232" font-size="14" class="ink">ToolsLab LLMs</text><text x="830" y="232" text-anchor="end" font-size="12" class="muted">ACTIVE</text></g><g class="reveal r4"><text x="52" y="274" font-size="12" class="muted">04</text><text x="94" y="274" font-size="12" fill="#5468FF">SYNC</text><text x="156" y="274" font-size="14" class="ink">GitHub signals</text><text x="830" y="274" text-anchor="end" font-size="12" class="muted">AUTO-REFRESH ARMED</text></g><line x1="40" y1="302" x2="860" y2="302" class="hair"/><text x="52" y="318" font-size="11" class="muted">&gt; research → build → audit → ship</text><rect class="blink" x="335" y="307" width="8" height="14" rx="1" fill="var(--accent)"/><rect class="scan" x="30" y="78" width="90" height="210" fill="url(#accent)" opacity=".08"/>
</svg>